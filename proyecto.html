<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SegurApp - Ingreso</title>

    <link rel="stylesheet" href="CSS/proyecto.css">
</head>

<body>

    <main class="login-container">

        <!-- Panel izquierdo -->
        <section class="login-banner">

            <img src="IMGS/imagen-login.jpeg" alt="SegurApp">

        </section>


        <!-- Panel derecho -->
        <section class="login-form">

            <!-- Logo -->
            <div class="logo-contenedor">
                <img src="IMGS/logoSegurApp.png" alt="Logo de SegurApp">
            </div>


            <!-- Título -->
            <h1>Ingreso al Sistema</h1>


            <!-- Formulario -->
            <form>

                <!-- Correo -->
                <div class="grupo-formulario">

                    <label for="correo">Correo Electrónico</label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="segurapp@gmail.com"
                        required
                    >

                </div>


                <!-- Contraseña -->
                <div class="grupo-formulario">

                    <label for="contrasena">Contraseña</label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="********"
                        required
                    >

                </div>


                <!-- Recuperar contraseña -->
                <div class="olvidar-contraseña">

                    <a href="recuperar.contraseña.html">¿Olvidaste tu contraseña?</a>

                </div>


                <!-- Botón -->
                 <div class="boton-entrar">
                <button type="submit">
                    Entrar
                </button>
                 </div>

            </form>


            <!-- Volver -->
            <a href="#" class="boton-volver">
                 Volver
            </a>

        </section>

    </main>

</body>

</html>
