<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña - SegurApp</title>

    <link rel="stylesheet" href="CSS/recuperar.contraseña.css">
</head>

<body>

    <main class="contenedor-recuperacion">

        <section class="tarjeta-recuperacion">

            <div class="logo">
    <img src="IMGS/logoSegurApp.png" alt="Logo de SegurApp">
</div>
            <h1>Recuperar contraseña</h1>

            <p class="descripcion">
                Ingresa tu correo electrónico y te enviaremos
                un enlace para restablecer tu contraseña.
            </p>

            <form>

                <div class="grupo-campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Ingresa tu correo electrónico"
                        required
                    >

                </div>

                <button type="submit" class="boton-enviar">
                    Enviar enlace
                </button>

            </form>

            <a href="proyecto.html" class="volver">
                ← Volver al inicio de sesión
            </a>

        </section>

    </main>

</body>

</html>
